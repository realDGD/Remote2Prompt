name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Privacy, documentation and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation and publication boundaries
        run: |
          make docs-check
          ruby scripts/check-publication.rb --history
      - name: Install pinned checking tools
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/r2p-check-tools"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Scan all reachable commits for credentials
        run: '"$RUNNER_TEMP/r2p-check-tools/gitleaks" git --redact --no-banner --log-opts="--all" .'
      - name: Validate workflow syntax
        run: '"$RUNNER_TEMP/r2p-check-tools/actionlint" -color'

  macos:
    name: CLT and Homebrew (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify standalone CLT and runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test -d "$DEVELOPER_DIR"
          swift_path=$(/usr/bin/xcrun --find swift)
          case "$swift_path" in "$DEVELOPER_DIR"/*) ;; *) echo 'Swift is outside standalone CLT' >&2; exit 1 ;; esac
          /usr/bin/xcrun swift --version
          /usr/bin/xcrun --sdk macosx --show-sdk-path
      - name: Core checks, adapter checks, Release bundle and repository checks
        run: /usr/bin/make check
      - name: Generate local Homebrew source archive and formula
        run: /usr/bin/ruby scripts/prepare-homebrew.rb --tap remote2prompt/ci
      - name: Install and test from source in Homebrew sandbox
        run: |
          brew tap --custom-remote remote2prompt/ci "$PWD/dist/homebrew/tap"
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula remote2prompt/ci/remote2prompt
            brew trust --cask remote2prompt/ci/remote2prompt-app
          fi
          brew install --build-from-source remote2prompt/ci/remote2prompt
          brew install --cask remote2prompt/ci/remote2prompt-app
          test -d /Applications/Remote2Prompt.app
          test ! -L /Applications/Remote2Prompt.app
          brew test remote2prompt/ci/remote2prompt
          remote2prompt --version
          remote2prompt --self-check
      - name: Verify Applications uninstall and settings cleanup
        run: |
          defaults write dev.remote2prompt.app homebrewCICheck -bool true
          brew uninstall --cask --zap remote2prompt/ci/remote2prompt-app
          test ! -e /Applications/Remote2Prompt.app
          test ! -e "$HOME/Library/Preferences/dev.remote2prompt.app.plist"
      - name: Remove CI-only Homebrew installation
        if: always()
        run: |
          if brew list --cask remote2prompt-app >/dev/null 2>&1; then
            brew uninstall --cask --zap remote2prompt/ci/remote2prompt-app
          fi
          if brew list --formula remote2prompt >/dev/null 2>&1; then
            brew uninstall --formula remote2prompt
          fi
          test ! -e "$(brew --prefix)/bin/remote2prompt"
          if brew tap | /usr/bin/grep -qx 'remote2prompt/ci'; then
            brew untap remote2prompt/ci
          fi
